<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1536px;height:1024px;overflow:hidden;background:#f6f4ef}
  .thumb{position:relative;width:1536px;height:1024px;overflow:hidden;color:#19291f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,246,239,.97) 0%,rgba(248,246,239,.92) 27%,rgba(248,246,239,.62) 40%,rgba(248,246,239,0) 59%)}
  .copy{position:absolute;left:100px;top:115px;width:520px}
  .kicker{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.5px;color:#1e6949;text-transform:uppercase}
  h1{font-size:100px;line-height:1;letter-spacing:-5px;margin:26px 0 23px;font-weight:800}
  p{max-width:475px;font-size:34px;line-height:1.22;letter-spacing:-.7px;font-weight:600;color:#48584c;margin:0}
  .rule{width:76px;height:6px;border-radius:9px;background:#b1d94a;margin-top:35px}
  .meta{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;color:#6d7d70;margin-top:24px}
</style>
<div class="thumb" id="thumbnail">
  <img src="upahkit-thumbnail-art.png" alt="">
  <div class="wash"></div>
  <div class="copy">
    <div class="kicker">Malaysia · Gig work · MYR</div>
    <h1>UpahKit</h1>
    <p>Keep the shift.<br>Make the pay story clear.</p>
    <div class="rule"></div>
    <div class="meta">WORK · PAYMENTS · PROOF</div>
  </div>
</div>
</html>
